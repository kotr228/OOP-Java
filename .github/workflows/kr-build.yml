# Автоматична збірка й тести пакета програм (каталог KR) при кожному push і PR
name: KR — збірка і тести

on:
  push:
    paths:
      - "KR/**"
      - ".github/workflows/kr-build.yml"
  pull_request:
    paths:
      - "KR/**"
      - ".github/workflows/kr-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KR
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: KR/**/pom.xml

      - name: Збірка, тести, jar
        run: ./mvnw -B --no-transfer-progress verify

      - name: Готова програма
        uses: actions/upload-artifact@v4
        with:
          name: insurance-app
          path: KR/insurance-desktop/target/insurance-app.jar
          if-no-files-found: error
